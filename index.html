<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0D10" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <title>Merijn Kersten — creative technologist</title>
    <meta
      name="description"
      content="I’m Merijn — I make things with AR, VR and code, and care way too much about whether they survive outside the demo room."
    />

    <!-- Open Graph / sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Merijn Kersten — VR, AR & digital twins" />
    <meta
      property="og:description"
      content="Building things that survive outside the demo room"
    />

    <!-- SPA redirect restore for GitHub Pages deep links (see public/404.html). -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #1B2A2E;">
        <h1>Merijn Kersten</h1>
        <p>I make things with AR, VR and code. This site leans on JavaScript for
        the interactive 3D, but every project is readable as plain text too — and
        you can always just email me at:
        <a href="mailto:info@merijnkersten.nl">info@merijnkersten.nl</a>.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
