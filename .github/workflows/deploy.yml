name: Deploy to GitHub Pages

on:
  push:
    # Deploy branch (no `main` in this repo yet). Change here if you adopt main.
    # NB: branch filters match the ref name only — no `origin/` remote prefix.
    branches: [claude/cleanup-refactor]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project site is served from /<repo>/. Change if the repo is renamed.
          VITE_BASE: /portfolio/
          # Launch-counter backend (docs/launch-counter.md). Set these two as
          # repository Variables (Settings → Secrets and variables → Actions →
          # Variables) — the anon key is public by design. Unset → the counter
          # simply doesn't render; everything else works.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
